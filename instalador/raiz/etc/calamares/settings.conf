# DuiaOS — instalador (Calamares). Sequência baseada na do Debian 13 (calamares-settings-debian),
# com as páginas do DuiaOS (QML, na pasta da identidade), uma por assunto, e o passo final "duiaos".
# A ordem das páginas mostradas está também em branding/duiaos/calamares-sidebar.qml (nomes das etapas).
---
modules-search: [ local, /usr/lib/calamares/modules, /usr/share/duiaos/instalador/modulos ]

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false

instances:
- id: aparencia
  module: packagechooserq
  config: aparencia.conf

sequence:
- show:
  - welcomeq
  - localeq
  - keyboardq
  - partition
  - usersq
  - packagechooserq
  - packagechooserq@aparencia
  - summaryq
- exec:
  - partition
  - mount
  - unpackfs
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - localeq
  - keyboardq
  - localecfg
  - usersq
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - luksbootkeyfile
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - duiaos
  - umount
- show:
  - finishedq

branding: duiaos
prompt-install: true
hide-back-and-next-during-exec: true
dont-chroot: false
