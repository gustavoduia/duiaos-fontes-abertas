# DuiaOS — instalador (Calamares). Sequência baseada na do Debian 13 (calamares-settings-debian),
# com a identidade do DuiaOS, a página "Programas e aparência" e o passo final "duiaos".
---
modules-search: [ local, /usr/lib/calamares/modules, /usr/share/duiaos/instalador/modulos ]

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - packagechooserq
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - luksbootkeyfile
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - duiaos
  - umount
- show:
  - finished

branding: duiaos
prompt-install: true
dont-chroot: false
