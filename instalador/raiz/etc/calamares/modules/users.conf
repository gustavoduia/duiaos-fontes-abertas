# DuiaOS — conta da pessoa (a do Debian 13, sem entrar sozinho: a Tela de Entrada do DuiaOS pede a senha)
---
userGroup:       users
defaultGroups: [ cdrom, floppy, sudo, audio, dip, video, plugdev, netdev, lpadmin, scanner, bluetooth, render, input ]
sudoersGroup:    sudo
setRootPassword: false
doReusePassword: true
doAutologin:     false
allowWeakPasswords: true
allowWeakPasswordsDefault: false
passwordRequirements:
    nonempty: true
    minLength: 4
    maxLength: -1
user:
  shell: /bin/bash
  forbidden_names: [ root, duia ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "duiaos-${cpu}"
