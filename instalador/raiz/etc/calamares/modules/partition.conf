# DuiaOS — página "Disco" (a única em widgets; o estilo vem de branding/duiaos/stylesheet.qss).
# ext4, partição EFI de 512 MiB, memória de troca em arquivo, criptografia oferecida (LUKS1, que o GRUB abre).
# Nenhuma escolha vem marcada: a pessoa decide entre apagar o disco, instalar ao lado ou fazer à mão.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "EFI"
userSwapChoices:
    - none
    - file
initialSwapChoice: file
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: none
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]
enableLuksAutomatedPartitioning: true
luksGeneration: luks1
